// Keep Flutter plugins on the app's declared Android Gradle Plugin version.
// This uses Gradle's dependency resolver; cached packages are never edited.
def appAgpVersion = gradle.startParameter.projectProperties['scanNumberOfflineAgpVersion']
// Init scripts also run in Flutter's included tooling build, which does not
// inherit the application's -P properties and must retain its own tooling.
if (appAgpVersion == null) {
    return
}
if (!(appAgpVersion ==~ /\d+\.\d+\.\d+/)) {
    throw new GradleException('A valid scanNumberOfflineAgpVersion is required for the offline init script.')
}

gradle.beforeProject { candidate ->
    candidate.buildscript.configurations.configureEach { configuration ->
        configuration.resolutionStrategy.eachDependency { details ->
            if (details.requested.group == 'com.android.tools.build' && details.requested.name == 'gradle') {
                details.useVersion(appAgpVersion)
                details.because('Offline build uses the same Android Gradle Plugin as the application')
            }
        }
    }
}
