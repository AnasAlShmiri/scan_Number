name: scan_number
description: تطبيق Flutter لمسح أرقام البطاقات وحفظها وتصديرها إلى Excel.
publish_to: "none"
version: 1.1.0+2

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  camera: 0.11.4
  google_mlkit_text_recognition: 0.15.1
  shared_preferences: 2.5.5
  excel: 4.0.6
  path_provider: 2.1.5
  share_plus: 11.1.0
  cross_file: 0.3.5+2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true
